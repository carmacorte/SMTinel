<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMTinel Bonepile Demo</title><style>body{font-family:Inter,Arial,sans-serif;background:#eef3f8;margin:0;padding:40px;color:#102A43}.demo{max-width:900px;margin:auto;background:#fff;border-radius:20px;padding:24px;border:1px solid #d9e6f7}.demo button{padding:10px 14px;border:0;border-radius:999px;background:#1f3a5f;color:white;font-weight:800;cursor:pointer}</style></head><body><div class="demo"><h1>Bonepile Visual Tracker</h1><p>Standalone demo using mock SMTinel globals.</p><button onclick="SMTinelBonepile.open()">Open module</button></div><script>window.TRACEOPS_YIELD_SN_TO_SFC={};for(var i=1;i<=180;i++){var line=['L12','L13','L14','L15','L16','L17','L18'][i%7],station={L12:'AOI2',L13:'AOI2',L14:'AOI4',L15:'AOI2',L16:'AOI4',L17:'AOI2',L18:'AOI4'}[line],sn='FJZDEMO'+String(i).padStart(4,'0');window.TRACEOPS_YIELD_SN_TO_SFC[sn]={sn:sn,wo:'1288'+String(i%13).padStart(3,'0'),sku:'73-20'+String(100+i%9)+'-0'+(i%6+1),line:line,event:station,agingDays:i%130,__smtinelHasRepair:i%11===0};}window.TRACEOPS_YIELD_REPAIRS_BY_SN={};Object.keys(window.TRACEOPS_YIELD_SN_TO_SFC).forEach(function(sn){if(window.TRACEOPS_YIELD_SN_TO_SFC[sn].__smtinelHasRepair)window.TRACEOPS_YIELD_REPAIRS_BY_SN[sn]=[{station:'REPAIR'}];});</script><script src="bonepile-loader.js"></script></body></html>
