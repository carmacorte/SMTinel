<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMTinel · Trace Monitor Protect</title>
<script>
(function () {
  'use strict';
  var CORE = 'index-app.html?v=bonepile-0.1.0';
  var MODULE = '<script src="modules/bonepile/bonepile-loader.js?v=0.1.0"><\/script>';
  var xhr = new XMLHttpRequest();
  try {
    xhr.open('GET', CORE, false);
    xhr.send(null);
    if ((xhr.status >= 200 && xhr.status < 300) || xhr.status === 0) {
      var html = String(xhr.responseText || '');
      if (!html) throw new Error('SMTinel core returned an empty document.');
      if (html.indexOf('modules/bonepile/bonepile-loader.js') < 0) {
        if (html.indexOf('</body>') >= 0) html = html.replace('</body>', MODULE + '\n</body>');
        else html += MODULE;
      }
      document.open();
      document.write(html);
      document.close();
      return;
    }
    throw new Error('HTTP ' + xhr.status);
  } catch (error) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<main style="max-width:760px;margin:48px auto;padding:24px;font-family:Inter,Arial,sans-serif;color:#102A43"><h1>SMTinel could not start</h1><p>The application core could not be loaded from <code>index-app.html</code>.</p><pre style="white-space:pre-wrap;background:#F7FAFF;border:1px solid #D9E6F7;border-radius:12px;padding:12px">' + String(error && error.message || error) + '</pre><p><a href="index-app.html">Open SMTinel core</a></p></main>';
    });
  }
}());
</script>
</head>
<body></body>
</html>
