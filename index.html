function rowHtml(r){return '<tr data-row="'+esc(r.autoKey||r.id)+'"><td><div class="yk-static">'+esc(r.product)+'</div><div class="yk-muted">'+esc(r.source||'')+'</div></td><td>'+field(r.sku,'sku',r)+'</td><td>'+field(r.rev,'rev',r)+'</td><td><select data-yk="side"><option'+(r.side==='N/D'?' selected':'')+'>N/D</option><option'+(r.side==='Top'?' selected':'')+'>Top</option><option'+(r.side==='Bottom'?' selected':'')+'>Bottom</option></select></td><td>'+field(r.line,'line',r)+'</td><td>'+field(r.ppProgram,'ppProgram',r)+'</td><td>'+field(r.aoiLibrary,'aoiLibrary',r)+'</td><td><div class="yk-static">'+esc(r.firstRun||'N/D')+'</div></td><td><div class="yk-static">'+esc(r.lastRun||'N/D')+'</div></td><td>'+field(r.status,'status',r,'selectStatus')+'<div style="margin-top:4px"><span class="yk-status '+statusClass(r.status)+'">'+esc(r.status)+'</span></div></td><td>'+(r.yokoten?'<div class="yk-ll-flag">Yokoten linked</div>':'')+field(r.findings,'findings',r,'textarea')+'</td><td>'+field(r.critical,'critical',r,'textarea')+'</td><td>'+field(r.migrationGate,'migrationGate',r,'textarea')+'</td><td>'+field(r.fai,'fai',r)+'<div style="margin-top:4px">'+linkCell(r.fai,'FAI')+'</div></td><td>'+field(r.sop,'sop',r)+'<div style="margin-top:4px">'+linkCell(r.sop,'SOP')+'</div></td><td>'+field(r.ll,'ll',r)+'<div style="margin-top:4px">'+linkCell(r.ll,'LL')+'</div></td><td>'+field(r.owner,'owner',r)+'</td><td><div class="yk-mini-actions"><button class="yk-btn" data-save="1">Save</button><button class="yk-del" data-del="1">Reset</button></div></td></tr>'}
function wire(rows,filtered){['ykSearch','ykProdFilter','ykLineFilter','ykStatusFilter','ykSideFilter'].forEach(function(id){var x=document.getElementById(id);if(x)x.addEventListener(id==='ykSearch'?'input':'change',debounce(render,120))});var rr=document.getElementById('ykRefreshBtn');if(rr)rr.onclick=render;Array.prototype.forEach.call(document.querySelectorAll('.yk-table tbody tr'),function(tr){var key=tr.getAttribute('data-row'),row=rows.find(function(r){return (r.autoKey||r.id)===key});if(!row)return;var saveBtn=tr.querySelector('[data-save]');if(saveBtn)saveBtn.onclick=function(){Array.prototype.forEach.call(tr.querySelectorAll('[data-yk]'),function(x){row[x.getAttribute('data-yk')]=x.value});persistRow(row);render()};var delBtn=tr.querySelector('[data-del]');if(delBtn)delBtn.onclick=function(){removeRow(row);render()}})}
function renderMigration(rows){var box=document.getElementById('ykMigration');if(!box)return;var products=uniq(rows.map(function(r){return r.product}).filter(Boolean)),selected=t((document.getElementById('ykMigProduct')||{}).value)||products[0]||'PICTORIS',allLines=uniq(rows.map(function(r){return r.line}).filter(Boolean)),target=t((document.getElementById('ykMigLine')||{}).value)||allLines[0]||'N/D',pr=rows.filter(function(r){return r.product===selected}),targetRow=pr.find(function(r){return r.line===target}),findings=uniq(pr.map(function(r){return r.findings}).filter(Boolean)),crit=uniq(pr.map(function(r){return r.critical}).filter(Boolean)),gates=uniq(pr.map(function(r){return r.migrationGate}).filter(Boolean)),history=uniq(pr.map(function(r){return r.line}).filter(Boolean));box.innerHTML='<h3>Migration readiness view</h3><div class="yk-field"><label>Product</label><select id="ykMigProduct">'+products.map(function(x){return'<option'+(x===selected?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div><div class="yk-field"><label>Target line</label><select id="ykMigLine">'+allLines.map(function(x){return'<option'+(x===target?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div><div class="yk-migration-box"><div class="yk-migration-item"><span>Historical lines</span><b>'+esc(history.join(', ')||'N/D')+'</b></div><div class="yk-migration-item"><span>Target status</span><b>'+esc(targetRow?targetRow.status:'Never run / evidence not found')+'</b></div><div class="yk-migration-item"><span>Inherited findings</span><b>'+esc(findings.join(' | ')||'None recorded')+'</b></div><div class="yk-migration-item"><span>Critical characteristics</span><b>'+esc(crit.join(' | ')||'None linked')+'</b></div><div class="yk-migration-item"><span>Required migration gate</span><b>'+esc(gates.join(' | ')||'Qualification evidence required before release.')+'</b></div></div><div class="yk-foot">Run history proves exposure, not qualification. Qualified status must be supported with controlled evidence such as FAI, released P&P/AOI revisions and applicable SOP/LL links.</div>';document.getElementById('ykMigProduct').onchange=function(){renderMigration(rows)};document.getElementById('ykMigLine').onchange=function(){renderMigration(rows)}}
function addManual(){var rows=load(STORE),id='YK-MAN-'+Date.now();rows.push({id:id,autoKey:id,product:'New Product',sku:'N/D',rev:'N/D',side:'N/D',line:'N/D',ppProgram:'N/D',aoiLibrary:'N/D',firstRun:'N/D',lastRun:'N/D',status:'Review Required',findings:'',critical:'',migrationGate:'Qualification evidence required before line migration.',fai:'',sop:'',ll:'',owner:'',source:'Manual'});save(STORE,rows);render()}
function uniq(a){var s={},o=[];a.forEach(function(x){x=t(x);if(x&&!s[x]){s[x]=1;o.push(x)}});return o.sort()}
function exportCsv(){var rows=mergedRows(),cols=['Product','Part Number','Rev','Side','Line','P&P Program','AOI Library','First Run','Last Run','Status','Historical Findings','Critical Characteristics','Migration Gate','FAI','SOP','8D/LL','Owner'],keys=['product','sku','rev','side','line','ppProgram','aoiLibrary','firstRun','lastRun','status','findings','critical','migrationGate','fai','sop','ll','owner'],q=function(v){return '"'+t(v).replace(/"/g,'""')+'"'},csv=[cols.map(q).join(',')].concat(rows.map(function(r){return keys.map(function(k){return q(r[k])}).join(',')})).join('\r\n'),a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='SMTinel_Yokoten_Line_Qualification_Matrix.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
