name: Inject 8D Railway bridge into feature index

on:
  push:
    branches:
      - feat/8d-export-center-railway-bridge
    paths:
      - .github/workflows/inject-8d-railway-bridge-feature.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Validate bridge and API syntax
        shell: bash
        run: |
          node --check assets/smtinel-8d-railway-bridge-v2025.js
          python3 -m py_compile services/8d-converter/serve_8d.py

      - name: Inject only bridge script into index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          src = index.read_text(encoding='utf-8')
          name = 'smtinel-8d-railway-bridge-v2025.js'
          if 'smtinel-exportcenter-frame' not in src:
              raise SystemExit('Export Center iframe not found; refusing to modify index')
          if name in src:
              print('Bridge already installed, no change required')
              raise SystemExit(0)
          marker = '<!-- SMTinel 8D Railway Bridge V20.25.2: lazy Export Center -->\n'
          script = '<script defer src="./assets/' + name + '"></script>\n'
          i = src.rfind('</body>')
          if i < 0:
              raise SystemExit('Missing closing body: refusing to modify index')
          out = src[:i] + marker + script + src[i:]
          if out.count(name) != 1:
              raise SystemExit('Non-idempotent injection, aborting')
          index.write_text(out, encoding='utf-8')
          print('Bridge injected into index.html without replacing previous modules.')
          PY

      - name: Commit targeted index change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(index): load isolated 8D Railway bridge in Export Center'
          git push origin HEAD:${GITHUB_REF_NAME}
