name: Patch Yield Flow line feature into index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-yieldflow-line-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject line feature loader into index
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'yieldflow-line-mapping.js?v=station-line-v1'

          if marker in text:
              print('index.html already contains Yield Flow line mapping loader')
              raise SystemExit(0)

          loader = '''\n<!-- SMTinel Yield Flow station + line integration -->\n<script src="yieldflow-line-mapping.js?v=station-line-v1"></script>\n'''

          if '</body>' in text:
              text = text.replace('</body>', loader + '</body>', 1)
          elif '</html>' in text:
              text = text.replace('</html>', loader + '</html>', 1)
          else:
              text += loader

          path.write_text(text, encoding='utf-8')
          print('Injected Yield Flow line mapping loader into index.html')

      - name: Verify integration
        shell: bash
        run: |
          grep -n "yieldflow-line-mapping.js?v=station-line-v1" index.html
          grep -n "yieldflow-line-mapping.js" yieldflow-main-thread-patch.js

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(yield-flow): load station line mapping from index"
          git push origin main
