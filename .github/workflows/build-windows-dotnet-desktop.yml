name: Build Windows Dotnet Desktop

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/refresh the safer .NET desktop release asset"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  pull_request:
    paths:
      - "desktop-dotnet/**"
      - "index.html"
      - "modules/**"
      - "assets/**"
      - "frontend/**"
      - "main/**"
      - "docs/**"
      - "data/**"
      - ".github/workflows/build-windows-dotnet-desktop.yml"
  push:
    branches:
      - main
    paths:
      - "tools/dotnet-portable-release-trigger.txt"
      - ".github/workflows/build-windows-dotnet-desktop.yml"

permissions:
  contents: write

jobs:
  build-windows-dotnet:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop-dotnet\SMTinel.Desktop.csproj

      - name: Publish launcher
        run: dotnet publish desktop-dotnet\SMTinel.Desktop.csproj -c Release -r win-x64 --self-contained false -o publish\SMTinel

      - name: Copy SMTinel web runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "publish\SMTinel"
          $folders = @("modules", "assets", "frontend", "main", "data", "docs", "examples", "export")
          Copy-Item "index.html" $target -Force
          if (Test-Path "README.md") { Copy-Item "README.md" $target -Force }
          foreach ($folder in $folders) {
            if (Test-Path $folder) {
              Copy-Item $folder $target -Recurse -Force
            }
          }

          # Copy root-level static files used by index.html and the landing pages.
          # The web version can resolve these from the repo root, but the portable
          # package only sees what we explicitly bundle. Tiny detail, huge nuisance.
          $rootPatterns = @(
            "*.html", "*.css", "*.js", "*.json", "*.webmanifest", "*.txt",
            "*.png", "*.jpg", "*.jpeg", "*.webp", "*.avif", "*.gif", "*.svg", "*.ico",
            "*.pdf", "*.PDF", "*.csv", "*.xlsx", "*.xlsm", "CNAME"
          )
          foreach ($pattern in $rootPatterns) {
            Get-ChildItem -Path . -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName $target -Force
            }
          }

      - name: Sign SMTinel executable if certificate secrets exist
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "publish\SMTinel\SMTinel.exe"
          if (-not (Test-Path $exe)) {
            throw "SMTinel.exe was not found at $exe"
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "Code signing secrets not configured. Build will continue unsigned. Windows will still say Unknown Publisher, because apparently trust must be purchased."
            return
          }

          $certPath = Join-Path $env:RUNNER_TEMP "smtinel-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the Windows runner."
          }

          & $signtool.FullName sign `
            /f $certPath `
            /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /d "SMTinel - Trace Monitor Protect" `
            $exe

          & $signtool.FullName verify /pa /v $exe
          Remove-Item $certPath -Force

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "SMTinel-Windows-Dotnet-Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "publish\SMTinel" -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload SMTinel .NET portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMTinel-Windows-Dotnet-Portable
          path: SMTinel-Windows-Dotnet-Portable.zip

      - name: Publish .NET portable release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true') || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-dotnet-latest
          name: SMTinel Windows Dotnet Portable
          body: |
            SMTinel Windows portable desktop package using a native .NET WebView2 launcher instead of PyInstaller.

            Download `SMTinel-Windows-Dotnet-Portable.zip`, extract the full folder, and run `SMTinel.exe`.

            Notes:
            - Do not run directly from the ZIP.
            - Keep the full folder together.
            - Requires Windows 10/11, .NET Desktop Runtime 8, and Microsoft Edge WebView2 Runtime.
            - This route avoids the PyInstaller bootloader that Defender can flag as unwanted software.
            - If repository secrets WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD are configured, SMTinel.exe is signed before packaging.
          files: SMTinel-Windows-Dotnet-Portable.zip
          make_latest: true
