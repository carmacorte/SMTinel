name: Patch Product Improvement export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-product-improvement-export.yml'
      - 'product-improvement-module-entry.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Patch index loader
        shell: bash
        run: |
          node --check product-improvement-module-entry.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          o = s
          s = re.sub(r'product-improvement-module-entry\.js\?v=\d+', 'product-improvement-module-entry.js?v=7', s)
          if 'product-improvement-module-entry.js?v=7' not in s:
              closing = s.rfind('</body>')
              if closing < 0:
                  raise SystemExit('missing </body>')
              s = s[:closing] + '<script src="./product-improvement-module-entry.js?v=7"></script>\n' + s[closing:]
          if s != o:
              p.write_text(s, encoding='utf-8')
              print('index.html now loads Product Improvement module v7')
          else:
              print('index.html already current')
          PY
      - name: Commit index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index update required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(index): load Product Improvement module v7'
          git push origin HEAD:${GITHUB_REF_NAME}
