name: Patch Product Improvement export

on:
  push:
    branches:
      - main
      - agent/product-improvement-inline-v4
    paths:
      - '.github/workflows/patch-product-improvement-export.yml'
      - 'product-improvement-export.js'
      - 'product-improvement-context-adapter.js'
      - 'product-improvement-module-entry.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Validate source scripts
        shell: bash
        run: |
          test -s product-improvement-context-adapter.js
          test -s product-improvement-export.js
          test -s product-improvement-module-entry.js
          node --check product-improvement-context-adapter.js
          node --check product-improvement-export.js
          node --check product-improvement-module-entry.js

      - name: Inline Product Improvement scripts into index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          original = text

          sources = [
              ('context', Path('product-improvement-context-adapter.js')),
              ('export', Path('product-improvement-export.js')),
              ('module', Path('product-improvement-module-entry.js')),
          ]

          # Remove every previous Product Improvement loader, whether external or inline.
          text = re.sub(
              r'\s*<!-- SMTinel Product Improvement (?:Export|Module Entry|Inline Bundle)[^>]*-->\s*',
              '\n',
              text,
              flags=re.I,
          )
          text = re.sub(
              r'\s*<script[^>]+src=["\']\.\/product-improvement-(?:context-adapter|export|module-entry)\.js(?:\?v=\d+)?["\'][^>]*>\s*</script>\s*',
              '\n',
              text,
              flags=re.I,
          )
          text = re.sub(
              r'\s*<script\s+data-smtinel-product-improvement=["\'][^"\']+["\'][^>]*>.*?</script>\s*',
              '\n',
              text,
              flags=re.I | re.S,
          )

          blocks = ['<!-- SMTinel Product Improvement Inline Bundle v4 -->']
          for name, path in sources:
              js = path.read_text(encoding='utf-8').strip()
              if '</script' in js.lower():
                  raise SystemExit(f'{path} contains a closing script tag')
              blocks.append(
                  f'<script data-smtinel-product-improvement="{name}-v4">\n{js}\n</script>'
              )
          bundle = '\n'.join(blocks) + '\n'

          closing = text.rfind('</body>')
          if closing < 0:
              raise SystemExit('index.html does not contain </body>')
          text = text[:closing] + bundle + text[closing:]

          if text != original:
              index_path.write_text(text, encoding='utf-8')
              print('Product Improvement v4 inlined into index.html.')
          else:
              print('index.html already current.')
          PY

      - name: Validate standalone integration
        shell: bash
        run: |
          grep -Fq 'SMTinel Product Improvement Inline Bundle v4' index.html
          grep -Fq 'data-smtinel-product-improvement="context-v4"' index.html
          grep -Fq 'data-smtinel-product-improvement="export-v4"' index.html
          grep -Fq 'data-smtinel-product-improvement="module-v4"' index.html
          grep -Fq "Product Improvement" index.html
          if grep -Eq 'src=["'"']\./product-improvement-(context-adapter|export|module-entry)\.js' index.html; then
            echo 'External Product Improvement loader still present.'
            exit 1
          fi

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index update required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(index): inline Product Improvement module for standalone use'
          git push origin HEAD:${GITHUB_REF_NAME}
