name: Patch Product Improvement export

on:
  push:
    branches:
      - main
      - agent/product-improvement-export
      - agent/product-improvement-visible-module
    paths:
      - '.github/workflows/patch-product-improvement-export.yml'
      - 'product-improvement-export.js'
      - 'product-improvement-context-adapter.js'
      - 'product-improvement-module-entry.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Inject Product Improvement scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          export_marker = '<!-- SMTinel Product Improvement Export v1 -->'
          export_block = '''<!-- SMTinel Product Improvement Export v1 -->
          <script src="./product-improvement-context-adapter.js?v=1"></script>
          <script src="./product-improvement-export.js?v=1"></script>
          '''
          module_marker = '<!-- SMTinel Product Improvement Module Entry v2 -->'
          module_block = '''<!-- SMTinel Product Improvement Module Entry v2 -->
          <script src="./product-improvement-module-entry.js?v=2"></script>
          '''

          text = text.replace('<!-- SMTinel Product Improvement Module Entry v1 -->\n          <script src="./product-improvement-module-entry.js?v=1"></script>\n', '')
          text = text.replace('<script src="./product-improvement-module-entry.js?v=1"></script>', '<script src="./product-improvement-module-entry.js?v=2"></script>')
          text = text.replace('<!-- SMTinel Product Improvement Module Entry v1 -->', '<!-- SMTinel Product Improvement Module Entry v2 -->')

          closing = text.rfind('</body>')
          if closing < 0:
              raise SystemExit('index.html does not contain </body>')

          blocks = []
          if export_marker not in text:
              blocks.append(export_block)
          if module_marker not in text:
              blocks.append(module_block)

          if blocks:
              text = text[:closing] + ''.join(blocks) + '\n' + text[closing:]

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Product Improvement scripts refreshed in index.html.')
          else:
              print('Product Improvement loaders already current.')
          PY

      - name: Validate integration
        shell: bash
        run: |
          grep -Fq 'SMTinel Product Improvement Export v1' index.html
          grep -Fq 'product-improvement-context-adapter.js?v=1' index.html
          grep -Fq 'product-improvement-export.js?v=1' index.html
          grep -Fq 'SMTinel Product Improvement Module Entry v2' index.html
          grep -Fq 'product-improvement-module-entry.js?v=2' index.html
          test -s product-improvement-context-adapter.js
          test -s product-improvement-export.js
          test -s product-improvement-module-entry.js
          node --check product-improvement-module-entry.js

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index update required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'hotfix(index): load Product Improvement module v2'
          git push origin HEAD:${GITHUB_REF_NAME}
